<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock Test Tools</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    p {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: .95rem;
    }
    .links {
      display: grid;
      gap: 12px;
    }
    a {
      display: block;
      text-decoration: none;
      background: #2563eb;
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      transition: background .15s ease;
    }
    a.secondary {
      background: #0f766e;
    }
    a:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mock Test Option Generators</h1>
    <p>Hosted over HTTPS so YouTube embeds work without Error 153.</p>
    <div class="links">
      <a href="./mock-test-option-generator.html">Mock Test Option Generator</a>
      <a class="secondary" href="./mock-options-without-socials.html">Mock Options Without Socials</a>
    </div>
  </main>
</body>
</html>
